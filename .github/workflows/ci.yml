name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: webhive
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: webhive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U webhive -d webhive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://webhive:ci-only-password@localhost:5432/webhive_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm --prefix backend run check
      - name: Prepare disposable database
        run: npm --prefix backend run db:setup
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm --prefix backend test
      - run: npm audit --prefix backend --omit=dev --audit-level=high
      - run: npx --prefix backend playwright install --with-deps chromium
      - run: npm --prefix backend run test:browser
